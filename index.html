<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hiring Message Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="hub-css">
/* Layout: one page at a time. Roles grid → a role with stage tabs → one message in focus. Deep night canvas, drifting aurora, each role owns a gradient. */
:root{
  color-scheme:dark;
  --bg:#09091A; --glass:rgba(255,255,255,.05); --glass-2:rgba(255,255,255,.085); --glass-3:rgba(255,255,255,.13);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.18);
  --ink:#F5F4FF; --muted:#B0AFD0; --dim:#8584AE;
  --violet:#8B5CFF; --cyan:#22D3EE; --amber:#FFB547; --mint:#34D399;
  --brand:linear-gradient(120deg,#FF4D8D 0%,#8B5CFF 50%,#22D3EE 100%);
  --st0:#FF6B9A; --st1:#FFB547; --st2:#8C9BFF; --st3:#34D399;
  --tok-bg:rgba(255,181,71,.16); --tok-ink:#FFD58A; --ok-bg:rgba(52,211,153,.16); --ok-ink:#7FF0C6;
  --danger:#FF6B6B; --scrim:rgba(5,5,16,.72);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
a{color:var(--cyan)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
::selection{background:rgba(139,92,255,.45)}

.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-14vw;background:#8B5CFF;animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-12vw;top:4vw;background:#FF4D8D;opacity:.3;animation:drift2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:38vw;height:38vw;left:28vw;top:38vh;background:#22D3EE;opacity:.16;animation:drift3 30s ease-in-out infinite alternate}
.aurora::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 0%,var(--bg) 80%)}
@keyframes drift1{to{transform:translate(18vw,12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,22vh) scale(.9)}}
@keyframes drift3{to{transform:translate(-20vw,-18vh) scale(1.2)}}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}

.top{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(9,9,26,.62);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--stroke)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.lm{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;color:#fff;box-shadow:0 6px 20px -6px rgba(139,92,255,.8)}
.logo b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.1}
.logo small{color:var(--dim);font-size:12px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:0 12px;width:min(340px,100%);transition:border-color .2s,background .2s}
.search:focus-within{border-color:var(--violet);background:var(--glass-2)}
.search svg{flex:none;color:var(--dim)}
.search input{border:0;background:transparent;outline:none;padding:9px 0;width:100%;min-width:0}
.search input::placeholder{color:var(--dim)}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--dim);border:1px solid var(--stroke-2);border-radius:5px;padding:0 5px}

.main{padding-block:34px 150px;display:grid;gap:26px;min-width:0}
.enter{animation:rise .5s var(--ease) both}
.stagger>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grad-text{background:var(--brand);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 8s linear infinite alternate}
@keyframes sheen{to{background-position:100% 0}}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--dim)}
.crumbs button{background:none;border:0;padding:4px 8px;margin:-4px -2px;border-radius:8px;color:var(--muted);font-weight:500}
.crumbs button:hover{background:var(--glass-2);color:var(--ink)}
.crumbs .here{color:var(--ink);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--stroke-2);background:var(--glass);border-radius:12px;padding:9px 15px;font-weight:600;font-size:14px;transition:background .2s,border-color .2s,transform .15s}
.btn:hover{background:var(--glass-3);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff;box-shadow:0 10px 30px -12px rgba(255,77,141,.8)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--glass)}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.35);background:transparent}
.btn.armed{background:var(--danger)!important;color:#fff!important;border-color:var(--danger)!important}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.spacer{flex:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* HOME */
.hero{display:grid;gap:14px;padding-block:18px 6px}
.hero h1{font-size:clamp(36px,6.4vw,68px);line-height:1;font-weight:800;max-width:15ch}
.hero p{margin:0;color:var(--muted);font-size:17px;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.stat{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:12px 18px;min-width:130px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--dim)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-title h2{font-size:22px}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.rcard{position:relative;display:grid;align-content:start;text-align:left;border:1px solid var(--stroke);background:var(--glass);border-radius:22px;padding:0;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.rcard:hover{transform:translateY(-6px);border-color:var(--stroke-2);box-shadow:0 30px 60px -28px var(--gb)}
.rc-band{position:relative;height:132px;background:linear-gradient(135deg,var(--ga),var(--gb));overflow:hidden;padding:18px;display:flex;justify-content:space-between;align-items:flex-start}
.rc-band::before{content:"";position:absolute;left:-50%;top:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.35),transparent 40%);animation:spin 9s linear infinite;opacity:.45}
.rc-band::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 120%,rgba(9,9,26,.55),transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.rc-ini{position:relative;z-index:1;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:#fff;letter-spacing:-.04em;text-shadow:0 4px 24px rgba(0,0,0,.25)}
.rc-count{position:relative;z-index:1;background:rgba(9,9,26,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.rc-body{padding:16px 18px 18px;display:grid;gap:6px}
.rc-name{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.15}
.rc-team{font-size:13px;color:var(--dim)}
.rc-budget{font-size:14px;color:var(--muted);margin-top:4px}
.rc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.sdot{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--glass-2);border-radius:999px;padding:3px 9px}
.sdot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st)}
.rc-go{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);transition:background .3s,transform .3s var(--ease)}
.rcard:hover .rc-go{background:linear-gradient(135deg,var(--ga),var(--gb));transform:translateX(3px)}
.rcard.new{place-content:center;justify-items:center;gap:12px;min-height:280px;border-style:dashed;border-color:var(--stroke-2);background:transparent;color:var(--muted);text-align:center;padding:24px}
.rcard.new .plus{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--glass-2);transition:background .3s,transform .3s var(--ease)}
.rcard.new:hover{color:var(--ink);box-shadow:none}
.rcard.new:hover .plus{background:var(--brand);transform:rotate(90deg);color:#fff}
.rcard.new b{font-family:var(--f-display);font-size:19px;color:var(--ink)}
.rcard.new small{font-size:13px;max-width:26ch}

/* ROLE */
.rhero{position:relative;border-radius:26px;overflow:hidden;padding:30px clamp(20px,4vw,40px) 28px;border:1px solid var(--stroke-2);isolation:isolate}
.rhero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(130deg,var(--ga),var(--gb),var(--ga));background-size:220% 220%;animation:flow 14s ease-in-out infinite alternate}
.rhero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 100% 100%,rgba(9,9,26,.7),transparent 55%),linear-gradient(180deg,rgba(9,9,26,0) 30%,rgba(9,9,26,.45))}
@keyframes flow{to{background-position:100% 100%}}
.rhero .eyebrow{color:rgba(255,255,255,.85)}
.rhero h1{font-size:clamp(34px,5.6vw,56px);font-weight:800;line-height:1.02;color:#fff;margin-top:6px}
.rhero p{color:rgba(255,255,255,.9);max-width:62ch;margin:10px 0 0;font-size:15.5px}
.rhero .row{margin-top:20px}
.rhero .btn{background:rgba(9,9,26,.3);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rhero .btn:hover{background:rgba(9,9,26,.5)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:5px;background:rgba(18,18,40,.7);border:1px solid var(--stroke);border-radius:16px;scrollbar-width:none;position:sticky;top:calc(var(--toph,70px) + 8px);z-index:5;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--muted);transition:background .25s,color .25s}
.tab:hover{color:var(--ink);background:var(--glass-2)}
.tab .tl{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--st,var(--ink))}
.tab .tn{font-family:var(--f-mono);font-size:11px;background:var(--glass-2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:#0B0B1E}
.tab[aria-selected="true"] .tn{background:rgba(9,9,26,.1);color:#0B0B1E}
.tab[aria-selected="true"] .tl{color:#0B0B1E}
.tab.add{color:var(--dim)}
.panel{display:grid;gap:22px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0}
.tile{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:16px 18px;min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--ga),var(--gb));opacity:.8}
.tile dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tile dd{margin:6px 0 0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.block{display:grid;gap:14px}
.block h2{font-size:19px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.lnk{display:inline-flex;align-items:center;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;overflow:hidden;max-width:100%}
.lnk a{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;min-width:0}
.lnk a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk a svg{flex:none;color:var(--cyan)}
.lnk a:hover{color:var(--cyan)}
.lnk button{border:0;border-left:1px solid var(--stroke);background:transparent;padding:10px 12px;color:var(--muted);font-size:13px;font-weight:600}
.lnk button:hover{background:var(--glass-2);color:var(--ink)}
.lnk button.done{color:var(--mint)}
.lnk.empty{border-style:dashed;padding:10px 14px;color:var(--dim);font-size:13.5px}
.steps{list-style:none;margin:0;padding:0;display:grid}
.steps li{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding-bottom:18px}
.steps li:not(:last-child)::after{content:"";position:absolute;left:16px;top:38px;bottom:4px;width:2px;background:linear-gradient(var(--ga),var(--gb));opacity:.45;border-radius:2px}
.steps .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--ga),var(--gb))}
.steps p{margin:6px 0 0}
.callout{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,rgba(139,92,255,.16),rgba(34,211,238,.08));border:1px solid rgba(139,92,255,.3);border-radius:16px;padding:14px 16px;font-size:14.5px}
.callout svg{flex:none;color:#B49BFF;margin-top:2px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.sec-head .eyebrow{color:var(--st)}
.sec-head h2{font-size:clamp(22px,3vw,28px);margin-top:4px}
.sec-head p{margin:4px 0 0;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;overflow:hidden;transition:transform .3s var(--ease),border-color .3s,background .3s}
.mrow:hover{transform:translateX(4px);border-color:color-mix(in srgb,var(--st) 55%,transparent);background:var(--glass-2)}
.mr-open{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:16px 18px;min-width:0}
.code{font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--st);background:color-mix(in srgb,var(--st) 16%,transparent);border:1px solid color-mix(in srgb,var(--st) 35%,transparent);border-radius:9px;padding:5px 9px;line-height:1.3}
.mr-main{min-width:0;display:grid;gap:2px}
.mr-main b{font-size:16px;font-weight:600}
.mr-main small{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;align-self:center}
.tag{display:inline-flex;align-items:center;height:22px;line-height:1;font-size:11.5px;font-weight:600;border-radius:999px;padding:0 9px;background:var(--glass-2);color:var(--muted);white-space:nowrap}
.tag.opt{background:rgba(255,181,71,.14);color:var(--amber)}
.mr-copy{border:0;border-left:1px solid var(--stroke);background:transparent;padding:0 18px;display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:13px;transition:background .2s,color .2s}
.mr-copy:hover{background:var(--glass-3);color:var(--ink)}
.mr-copy.done{color:var(--mint)}
.add-line{justify-self:start;display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--stroke-2);background:transparent;border-radius:14px;padding:11px 16px;color:var(--muted);font-weight:600}
.add-line:hover{color:var(--ink);border-color:var(--violet);background:rgba(139,92,255,.08)}
.empty{border:1px dashed var(--stroke-2);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}

/* MESSAGE */
.msg-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.msg-h .code{font-size:15px;padding:8px 12px;border-radius:12px}
.msg-h h1{font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.08}
.when{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:62ch}
.when b{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--st);margin-right:8px}
.msg-h .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.msg-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.chat{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--stroke);border-radius:24px;overflow:hidden;min-width:0}
.chat-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--stroke);background:rgba(9,9,26,.35)}
.chat-top .av{width:30px;height:30px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:11px;color:#fff;flex:none}
.chat-top b{font-size:13.5px;display:block;line-height:1.2}
.chat-top small{font-size:12px;color:var(--dim)}
.vtabs{margin-left:auto;display:flex;gap:4px;background:var(--glass);border-radius:10px;padding:3px}
.vtabs button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.vtabs button[aria-selected="true"]{background:var(--glass-3);color:var(--ink)}
.chat-body{padding:22px clamp(14px,3vw,26px) 26px;display:flex;justify-content:flex-end;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:18px 18px}
.bubble{position:relative;max-width:58ch;min-width:0;background:linear-gradient(150deg,color-mix(in srgb,var(--ga) 34%,#1a1840),color-mix(in srgb,var(--gb) 30%,#16163a));border:1px solid rgba(255,255,255,.12);border-radius:20px 20px 6px 20px;padding:14px 17px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6;box-shadow:0 20px 40px -24px rgba(0,0,0,.8);animation:pop .45s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.bubble a{color:#A5ECFF;word-break:break-all}

function renderSaveBar() {
  const b = $('#savebar'); document.body.classList.toggle('dirty', !!dirty);
  if (!dirty) { b.hidden = true; b.innerHTML = ''; return; }
  const local = canSave === 'local';
  b.hidden = false;
  b.innerHTML = `<div class="sb-in"><span class="sb-dot"></span><span class="sb-txt"><b>${dirty} unsaved change${dirty > 1 ? 's' : ''}</b>
    <small>${local ? 'Kept in this browser. Saving for the team needs edit access to this page.' : 'Kept in this browser until you save for the team.'}</small></span>
    <button class="btn sm" data-action="discard">Discard</button>
    ${local ? '' : `<button class="btn sm primary" data-action="save">Save for the team</button>`}</div>`;
}

/* modals */
function openModal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="scrim" data-action="close-modal"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  setTimeout(() => m.querySelector('input:not([type=radio]),textarea')?.focus(), 40);
}
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
function newRoleModal() {
  openModal(`<h2>Add a role</h2><p class="sub">Whatever you're hiring for next. You can change everything later.</p>
    <label class="field" for="nr-name"><span>Role name</span><input id="nr-name" placeholder="e.g. Script Writer"></label>
    <label class="field" for="nr-sum"><span>One-line description (optional)</span><input id="nr-sum" placeholder="Every message for hiring script writers"></label>
    <div class="field"><span>Start from</span><div class="opts">
      <label class="opt" for="nr-std"><input type="radio" name="nr-start" id="nr-std" value="std" checked><span><b>Our standard hiring flow</b><small>8 ready messages from cold DM to hired or not selected, written for this role. Just swap the [brackets].</small></span></label>
      <label class="opt" for="nr-cp"><input type="radio" name="nr-start" id="nr-cp" value="copy"><span><b>A copy of an existing role</b><small>Same messages and links, ready to tweak.</small>
        <select id="nr-src" aria-label="Role to copy">${state.roles.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></span></label>
      <label class="opt" for="nr-blank"><input type="radio" name="nr-start" id="nr-blank" value="blank"><span><b>Blank</b><small>One empty section. Write everything yourself.</small></span></label>
    </div></div>
    <div class="row"><span class="spacer"></span><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="create-role">Create role</button></div>`);
}
function roleModal(r) {
  openModal(`<h2>Edit role</h2>
    <div class="g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><label class="field" for="rm-name"><span>Role name</span><input id="rm-name" value="${esc(r.name)}"></label>
      <label class="field" for="rm-team"><span>Team label</span><input id="rm-team" value="${esc(r.team)}"></label></div>
    <div class="field"><span>Colour</span><div class="swatches">${GRADS.map((g, i) => `<label class="sw" title="Colour ${i + 1}"><input type="radio" name="rm-grad" value="${i}" ${(r.grad ?? 0) === i ? 'checked' : ''} aria-label="Colour ${i + 1}"><span style="--ga:${g[0]};--gb:${g[1]}"></span></label>`).join('')}</div></div>
    <label class="field" for="rm-sum"><span>Description</span><textarea id="rm-sum" rows="3" style="min-height:80px">${esc(r.summary)}</textarea></label>
    <label class="field" for="rm-det"><span>Key details · one per line · Label: value</span><textarea id="rm-det" rows="4" style="min-height:100px">${esc(r.details.map(d => `${d.label}: ${d.value}`).join('\n'))}</textarea></label>
    <label class="field" for="rm-links"><span>Links · one per line · Label | https://…</span><textarea id="rm-links" rows="3" style="min-height:90px">${esc(r.links.map(l => `${l.label} | ${l.url}`).join('\n'))}</textarea></label>
    <label class="field" for="rm-flow"><span>How hiring works · one step per line</span><textarea id="rm-flow" rows="4" style="min-height:100px">${esc(r.flow.join('\n'))}</textarea></label>
    <label class="field" for="rm-note"><span>Team reminder</span><input id="rm-note" value="${esc(r.note)}"></label>
    <div class="row"><button class="btn sm danger" data-action="del-role">${icon('trash', 14)} Delete role</button><span class="spacer"></span>
      <button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-role">Save</button></div>`);
}
function secModal(s) {
  const isNew = !s, r = getRole();
  s = s || { code: String.fromCharCode(65 + r.sections.length), title: '', subtitle: '' };
  openModal(`<h2>${isNew ? 'Add a section' : 'Edit section'}</h2><p class="sub">Sections are the stages of hiring, like Outbound or Onboarding. Each one gets its own tab.</p>
    <div class="g2"><label class="field" for="sm-code"><span>Letter</span><input id="sm-code" value="${esc(s.code)}" maxlength="3"></label>
      <label class="field" for="sm-title"><span>Title</span><input id="sm-title" value="${esc(s.title)}" placeholder="e.g. Onboarding: after they join"></label></div>
    <label class="field" for="sm-sub"><span>Subtitle (optional)</span><input id="sm-sub" value="${esc(s.subtitle)}"></label>
    <div class="row">${isNew ? '' : `<button class="btn sm danger" data-action="del-sec" data-id="${s.id}">${icon('trash', 14)} Delete section</button>`}<span class="spacer"></span>
      <button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-sec" data-id="${isNew ? '' : s.id}">${isNew ? 'Add section' : 'Save'}</button></div>`);
}

/* utilities */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
  return Promise.resolve(fallbackCopy(text));
}
function arm(btn, label) {
  if (btn.dataset.armed) return true;
  const old = btn.innerHTML; btn.dataset.armed = '1'; btn.innerHTML = label; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.innerHTML = old; btn.classList.remove('armed'); } }, 3500);
  return false;
}
function flashCopied(el, html) {
  if (el.dataset.flash) return; el.dataset.flash = '1';
  el.classList.add('done'); const old = el.innerHTML; el.innerHTML = html;
  setTimeout(() => { if (el.isConnected) { el.classList.remove('done'); el.innerHTML = old; delete el.dataset.flash; } }, 1600);
}
function roleText(r) {
  return `${r.name} — Recruitment Templates\n\n` + r.sections.map(s => `==== ${s.code} · ${s.title} ====\n\n` + s.templates.map(t =>
    `${t.code} — ${t.title}\n(${t.optional ? 'Optional' : 'Send when'}: ${t.when})\n\n` + t.variants.map(v => (v.label ? `${v.label}:\n` : '') + filled(v.body, r.id)).join('\n\n')).join('\n\n----\n\n')).join('\n\n\n');
}
function buildDocument(data) {
  const css = document.getElementById('hub-css').textContent, js = document.getElementById('hub-js').textContent;
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body>` +
    `<title>${TITLE}</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="${FONTS}">\n` +
    `<style id="hub-css">${css}</style>\n<div id="app"></div>\n<script type="application/json" id="hub-data">${json}<\/script>\n<script id="hub-js">${js}<\/script>\n</body></html>`;
}
async function save(btn) {
  if (!artifact) { canSave = 'local'; renderSaveBar(); toast('Saving for the team isn’t available here. Your edits stay in this browser.'); return; }
  state.updatedAt = new Date().toISOString();
  persistDraft();
  store.set(SS_UI, { ui: { view: ui.view === 'search' ? 'home' : ui.view, role: ui.role, tab: ui.tab, tid: ui.tid, vid: ui.vid } }, true);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    await artifact.publish(buildDocument(state));
    store.del(LS_DRAFT); toast('Saved for the team');
  } catch (e) {
    const code = e && e.code;
    if (btn) { btn.disabled = false; btn.textContent = 'Save for the team'; }
    if (code === 'conflict') toast('Someone saved first. Loading their version — your edits can be restored.');
    else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) {
      canSave = 'local'; renderSaveBar(); toast('Only editors can save for the team. Your edits stay in this browser.');
    } else if (code === 'rate_limited') toast('Saving too often. Wait a minute, then save again.');
    else if (code === 'too_large') toast('The page is too large to save. Remove a few long messages and try again.');
    else toast('Couldn’t save just now. Try again in a moment.');
  }
}

/* events */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id, r = getRole();
  switch (a) {
    case 'home': go({ view: 'home' }); break;
    case 'set-mode': {
      const want = el.dataset.mode;
      if (want === autoMode()) store.del(LS_MODE); else store.set(LS_MODE, want);
      applyMode(); render(true); window.scrollTo(0, 0);
      toast(want === 'phone' ? 'Phone view' : 'Computer view'); break;
    }
    case 'open-role': go({ view: 'role', role: id, tab: 'overview' }); break;
    case 'tab': {
      ui.tab = id; ui.editing = false; render();
      const p = $('#panel'); if (p) { p.classList.add('enter'); const tb = $('.tabs'); if (tb && tb.getBoundingClientRect().top < 80) window.scrollTo(0, tb.offsetTop - 80); }
      break;
    }
    case 'back-sec': { const f = findT(ui.tid); go({ view: 'role', role: f.r.id, tab: f.s.id }); break; }
    case 'open-msg': { const f = findT(id); go({ view: 'msg', role: f.r.id, tid: id, vid: f.t.variants[0].id, tab: f.s.id }); break; }
    case 'variant': ui.vid = el.dataset.vid; render(); break;
    case 'new-role': newRoleModal(); break;
    case 'create-role': {
      const name = $('#nr-name').value.trim(); if (!name) { $('#nr-name').focus(); toast('Give the role a name first'); return; }
      const sum = $('#nr-sum').value.trim(), start = document.querySelector('input[name=nr-start]:checked').value;
      let nr;
      if (start === 'std') nr = standardRole(name, sum);
      else if (start === 'copy') { nr = copyRole(state.roles.find(x => x.id === $('#nr-src').value), name); nr.team = `${name} team · hiring flow`; if (sum) nr.summary = sum; }
      else nr = blankRole(name, sum);
      closeModal(); state.roles.push(nr); bump(); go({ view: 'role', role: nr.id, tab: 'overview' }); toast(`${name} added`); break;
    }
    case 'edit-role': roleModal(r); break;
    case 'save-role': {
      const g = document.querySelector('input[name=rm-grad]:checked');
      const vals = { name: $('#rm-name').value.trim() || r.name, team: $('#rm-team').value.trim(), summary: $('#rm-sum').value.trim(), note: $('#rm-note').value.trim(),
        det: $('#rm-det').value, links: $('#rm-links').value, flow: $('#rm-flow').value };
      closeModal();
      change(() => {
        Object.assign(r, { name: vals.name, team: vals.team, summary: vals.summary, note: vals.note });
        if (g) r.grad = +g.value;
        r.details = vals.det.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf(':'); return i > -1 ? { label: l.slice(0, i).trim(), value: l.slice(i + 1).trim() } : { label: 'Note', value: l }; });
        r.links = vals.links.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf('|'); return i > -1 ? { label: l.slice(0, i).trim(), url: l.slice(i + 1).trim() } : (/^https?:/.test(l) ? { label: 'Link', url: l } : { label: l, url: '' }); });
        r.flow = vals.flow.split('\n').map(l => l.trim()).filter(Boolean);
      }); toast('Role updated'); break;
    }
    case 'del-role':
      if (state.roles.length < 2) { toast('Keep at least one role. Add another before deleting this one.'); return; }
      if (!arm(el, 'Click again to delete this role')) return;
      closeModal(); state.roles = state.roles.filter(x => x.id !== r.id); bump(); go({ view: 'home' }); toast('Role deleted'); break;
    case 'dup-role': { const nr = copyRole(r); state.roles.push(nr); bump(); go({ view: 'role', role: nr.id, tab: 'overview' }); toast('Duplicated. Rename it in Edit role.'); break; }
    case 'copy-role-text': copyText(roleText(r)).then(ok => toast(ok ? `Copied all ${count(r)} ${r.name} messages` : 'Copy was blocked here. Select the text and copy it yourself.')); break;
    case 'copy-backup': copyText(JSON.stringify(state, null, 2)).then(ok => toast(ok ? 'Backup copied. Paste it into a note to keep it safe.' : 'Copy was blocked here.')); break;
    case 'copy-link': copyText(el.dataset.url).then(ok => { if (ok) flashCopied(el, 'Copied'); toast(ok ? 'Link copied' : 'Copy was blocked here.'); }); break;
    case 'copy': {
      const f = findT(id); if (!f) return; const v = f.t.variants.find(x => x.id === el.dataset.vid) || f.t.variants[0];
      const text = filled(v.body, f.r.id), left = [...new Set(text.match(TOKEN_RE) || [])];
      copyText(text).then(ok => {
        if (!ok) { toast('Copy was blocked here. Select the message and copy it yourself.'); return; }
        flashCopied(el, el.classList.contains('copy-big') ? `${icon('check', 19)} Copied` : `${icon('check', 15)}<span class="lbl">Copied</span>`);
        toast(left.length ? `Copied. Still to fill: ${left.join(', ')}` : 'Copied, ready to send');
      }); break;
    }
    case 'edit-t': ui.editing = true; render(); setTimeout(() => $('#editor textarea')?.focus(), 30); break;
    case 'cancel-t': {
      const f = findT(ui.tid);
      if (f.t.fresh) { f.s.templates.splice(f.i, 1); dirty = Math.max(0, dirty - 1); dirty ? persistDraft() : store.del(LS_DRAFT); go({ view: 'role', role: f.r.id, tab: f.s.id }); }
      else { ui.editing = false; render(); }
      break;
    }
    case 'save-t': {
      const f = findT(ui.tid), ed = $('#editor'), g = n => ed.querySelector(`[data-f="${n}"]`);
      const vars = [...ed.querySelectorAll('.vrow')].map(row => ({ id: row.dataset.vid, label: row.querySelector('[data-f=vlabel]').value.trim(), body: row.querySelector('[data-f=vbody]').value.replace(/\s+$/, '') })).filter(v => v.body.trim());
      if (!vars.length) { toast('Write the message before saving'); ed.querySelector('textarea')?.focus(); return; }
      const vals = { code: g('code').value.trim() || f.t.code, title: g('title').value.trim() || 'Untitled message', when: g('when').value.trim(), channel: g('channel').value.trim(), optional: g('optional').checked, variants: vars };
      const wasFresh = f.t.fresh; ui.editing = false;
      if (!vars.some(v => v.id === ui.vid)) ui.vid = vars[0].id;
      const apply = () => { Object.assign(f.t, vals); delete f.t.fresh; };
      if (wasFresh) { apply(); persistDraft(); render(); } else change(apply);
      window.scrollTo(0, 0); toast('Message updated'); break;
    }
    case 'add-variant': { const box = $('#editor .vrows'); box.insertAdjacentHTML('beforeend', variantRow({ label: '', body: '' }, true)); box.lastElementChild.querySelector('textarea').focus(); break; }
    case 'rm-variant': el.closest('.vrow').remove(); break;
    case 'dup-t': { const f = findT(ui.tid); const c = clone(f.t); c.id = uid(); c.variants.forEach(v => v.id = uid()); c.title += ' (copy)'; f.s.templates.splice(f.i + 1, 0, c); bump(); go({ view: 'msg', tid: c.id, vid: c.variants[0].id }); toast('Duplicated'); break; }
    case 'move-t': {
      const f = findT(ui.tid), j = f.i + (+el.dataset.dir);
      if (j < 0 || j >= f.s.templates.length) { toast(+el.dataset.dir < 0 ? 'Already first in this stage' : 'Already last in this stage'); return; }
      change(() => { const arr = f.s.templates; [arr[f.i], arr[j]] = [arr[j], arr[f.i]]; }); toast('Moved'); break;
    }
    case 'del-t': { if (!arm(el, 'Click again to delete')) return; const f = findT(ui.tid); f.s.templates.splice(f.i, 1); bump(); go({ view: 'role', role: f.r.id, tab: f.s.id }); toast('Message deleted'); break; }
    case 'add-t': {
      const f = findS(id); const t = { id: uid(), code: `${f.s.code}${f.s.templates.length + 1}`, title: '', when: '', channel: 'WhatsApp', optional: false, fresh: true, variants: [{ id: uid(), label: '', body: '' }] };
      f.s.templates.push(t); bump(); go({ view: 'msg', role: f.r.id, tid: t.id, vid: t.variants[0].id, tab: f.s.id, editing: true }); setTimeout(() => $('#e-title')?.focus(), 30); break;
    }
    case 'add-sec': secModal(null); break;
    case 'edit-sec': secModal(findS(id).s); break;
    case 'save-sec': {
      const code = $('#sm-code').value.trim() || '?', title = $('#sm-title').value.trim();
      if (!title) { $('#sm-title').focus(); toast('Give the section a title'); return; }
      const sub = $('#sm-sub').value.trim(); closeModal();
      if (id) { const f = findS(id); change(() => Object.assign(f.s, { code, title, subtitle: sub })); }
      else { const s = { id: uid(), code, title, subtitle: sub, templates: [] }; change(() => { r.sections.push(s); ui.tab = s.id; }); }
      break;
    }
    case 'del-sec': {
      const f = findS(id), n = f.s.templates.length;
      if (!arm(el, n ? `Delete it and its ${n} message${n > 1 ? 's' : ''}?` : 'Click again to delete')) return;
      closeModal(); change(() => { f.r.sections.splice(f.i, 1); ui.tab = 'overview'; }); toast('Section deleted'); break;
    }
    case 'close-modal': closeModal(); break;
    case 'save': save(el); break;
    case 'discard':
      if (!arm(el, 'Click again to discard')) return;
      state = clone(published); dirty = 0; ui.editing = false; store.del(LS_DRAFT); render(); toast('Changes discarded'); break;
    case 'restore-draft': state = draftConflict.data; dirty = draftConflict.dirty || 1; draftConflict = null; persistDraft(); render(); toast('Your edits are back. Save to share them.'); break;
    case 'drop-draft': draftConflict = null; store.del(LS_DRAFT); render(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    ui.q = t.value;
    if (ui.q.trim()) { if (ui.view !== 'search') lastView = { view: ui.view, role: ui.role, tab: ui.tab, tid: ui.tid, vid: ui.vid }; ui.view = 'search'; ui.editing = false; render(); }
    else if (ui.view === 'search') { Object.assign(ui, lastView || { view: 'home' }); render(true); }
    return;
  }
  if (t.dataset.fill) { const f = findT(ui.tid); if (!f) return; fillsOf(f.r.id)[t.dataset.fill] = t.value; store.set(LS_FILL, fills); refreshMsg(); }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'Escape') {
    if (!$('#modal').hidden) { closeModal(); return; }
    if (document.activeElement?.id === 'q' && ui.q) { ui.q = ''; $('#q').value = ''; Object.assign(ui, lastView || { view: 'home' }); render(true); return; }
    if (typing) return;
    if (ui.view === 'msg' && !ui.editing) { const f = findT(ui.tid); go({ view: 'role', role: f.r.id, tab: f.s.id }); }
    else if (ui.view === 'role') go({ view: 'home' });
  }
  if (!typing && ui.view === 'msg' && !ui.editing && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const f = findT(ui.tid), list = flat(f.r), i = list.findIndex(x => x.id === ui.tid), n = list[i + (e.key === 'ArrowRight' ? 1 : -1)];
    if (n) go({ view: 'msg', tid: n.id, vid: n.variants[0].id, tab: findT(n.id).s.id });
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && ui.editing) $('[data-action="save-t"]')?.click();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's' && dirty && canSave !== 'local') { e.preventDefault(); save($('#savebar [data-action=save]')); }
});
window.addEventListener('beforeunload', () => { if (dirty) persistDraft(); });

applyMode();
const setTopH = () => root.style.setProperty('--toph', $('.top').offsetHeight + 'px');
setTopH();
if (window.ResizeObserver) new ResizeObserver(setTopH).observe($('.top'));
let rzT;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (applyMode()) render(); }, 120); });
render(true);
(async () => {
  try { if (window.claude && window.claude.use) artifact = await window.claude.use('artifact'); } catch (e) { artifact = null; }
  canSave = artifact ? 'yes' : 'local'; renderSaveBar();
})();
})();
</script>
